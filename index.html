<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portail Ville de Saint-André</title>
  <link rel="stylesheet" href="src/style.css">
  <link rel="icon" href="assets/favicon_standre.ico" type="image/x-icon">
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
  <script defer src="src/script.js"></script>
</head>
<body>

  <!-- Sidebar -->
  <aside id="sidebar" class="sidebar">
    <div class="sidebar-header">
      <h3>Applications</h3>
      <div class="sidebar-line"></div>
    </div>
    <nav class="sidebar-links">
      <a href="https://msamail.saint-andre.re/#1" target="_blank">
        <img src="assets/zimbra_logo.png" alt="Zimbra" class="sidebar-icon">
        <span>Zimbra</span>
      </a>
      <a href="https://glpiinfo.saint-andre.re/" target="_blank">
        <img src="assets/glpi_info_logo.png" alt="GLPI_info" class="sidebar-icon">
        <span>GLPI Info</span>
      </a>
      <a href="http://glpitech.saint-andre.re/" target="_blank">
        <img src="assets/glpi_tech_logo.png" alt="GLPI_tech" class="sidebar-icon">
        <span>GLPI Tech</span>
      </a>
      <a href="https://iparapheur.saint-andre.re/iparapheur/" target="_blank">
        <img src="assets/iparapheur_logo.png" alt="Iparapheur" class="sidebar-icon">
        <span>iParapheur</span>
      </a>
      <a href="http://s-cindoc.saint-andre.re/docflow/" target="_blank">
        <img src="assets/cindoc_logo.png" alt="Cindoc" class="sidebar-icon">
        <span>CinDoc-Mairie</span>
      </a>
    </nav>
  </aside>
  <div id="overlay" class="overlay"></div>

  <!-- Contenu principal -->
  <main>
    <header class="header">
      <div class="header-left">
        <img src="assets/logo.png" alt="Logo Ville de Saint-André" class="logo">
      </div>

      <div class="header-center">
        <h1>Ville de Saint-André</h1>
        <p>Portail des services numériques</p>
        <div id="date-time" class="date-time"></div>
      </div>

      <div class="header-right">
        <button id="menu-btn" class="menu-btn">
          <svg id="menu-icon" xmlns="http://www.w3.org/2000/svg" class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <line x1="4" y1="6" x2="20" y2="6"/>
            <line x1="4" y1="12" x2="20" y2="12"/>
            <line x1="4" y1="18" x2="20" y2="18"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Grille de services -->
    <section class="services">
      <a href="http://www.saint-andre.re/" target="_blank" class="card">
        <img src="assets/logo.png" alt="Site de la ville">
        <h3>Site de la ville</h3>
      </a>

      <a href="http://intranet2.saint-andre.re/" target="_blank" class="card">
        <img src="assets/logo_intra.jpg" alt="Intranet">
        <h3>Intranet</h3>
      </a>

      <a href="https://e-rh-st-andre.kelio.io/open/login" target="_blank" class="card">
        <img src="assets/kelio.png" alt="Badgeuse">
        <h3>Badgeuse</h3>
      </a>

      <a href="http://intranet2.saint-andre.re/index.php/applications/" target="_blank" class="card">
        <img src="assets/applications.png" alt="Applications">
        <h3>Applications</h3>
      </a>
    </section>
  </main>

  <div id="copyright">
    Copyright © 2025 - Mairie de Saint-André
  </div>

  <!-- Ticker -->
  <footer id="news-ticker" class="ticker">
    <div id="ticker-content">Chargement des actualités...</div>
  </footer>

</body>
</html>
